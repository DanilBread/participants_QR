databaseChangeLog:
  - changeSet:
      id: 2-create-qr-codes
      author: Tverdokhlebov Danil
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: qr_codes
      changes:
        - createTable:
            tableName: qr_codes
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: participant_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: participant_qr_fk
                    referencedTableName: participants
                    referencedColumnNames: id
              - column:
                 name: created_at
                 type: TIMESTAMP WITH TIME ZONE
                 defaultValueComputed: NOW()
                 constraints:
                   nullable: false
              - column:
                 name: updated_at
                 type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: qr_codes
            constraintName: participant_qr_fk
        - dropTable:
          tableName: qr_codes

