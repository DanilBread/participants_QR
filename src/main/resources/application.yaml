spring:
  application:
    name: participants-qr
  datasource:
    url: jdbc:postgresql://localhost:5432/participants_qr_db
    username: postgres
    password: postgres
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  output:
    ansi:
      enabled: always

server:
  port: 8080